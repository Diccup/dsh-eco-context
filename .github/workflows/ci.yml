name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ platform/plugin.js import '@deepseek-ai/schemastery'，不装依赖 → 16-entry 块必红。
      #   只装**运行时真正要的那几个**：
      #   · devDependencies 里的 @deepseek-ai/dsh-* 都是 rc 预发布版，整份装会失败
      #   · --legacy-peer-deps：package.json 里那批 rc 版 peerDependencies 解析不过，
      #     npm 默认严格模式会直接 ERESOLVE 报错 —— CI 不需要它们
      #   · --no-save：不改 package.json，仓库保持干净
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --ignore-scripts --no-save --no-package-lock `
            --legacy-peer-deps `
            "@deepseek-ai/schemastery@^3.18.1" "ajv@^8.20.0" "ajv-formats@^3.0.1" "zod@^4.6.7"

      - name: Syntax-check plugin entry
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.js,*.mjs -File |
            ForEach-Object { node --check $_.FullName }

      - name: Run self-test / acceptance gate
        shell: pwsh
        run: |
          # 落盘 + 进 job summary + 传成 artifact
          # ★ 注意：`node ... | Tee-Object` 之后 $LASTEXITCODE 是 Tee-Object 的（0），
          #   不是 node 的 —— 必须用 $LASTEXITCODE 之外的手段拿 node 的真实退出码，
          #   否则失败会被吞成"绿"（反过来也可能因管道行为报红）。这里用 $PWD 下的日志文件判断。
          $log = Join-Path $env:RUNNER_TEMP 'all-blocks.log'
          node engine/verify/all-blocks.mjs *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -ErrorAction SilentlyContinue
          }
          # 汇总行里有"失败项"就一定红（不依赖退出码传递）
          if (Select-String -Path $log -Pattern '失败项：' -Quiet -ErrorAction SilentlyContinue) { $code = 1 }
          if ($code -ne 0) {
            # 把失败详情做成 error 注解 —— 公开可读，不用等 API 限流解除就能看到真因
            # 取**失败项前后**的上下文（不只取尾部，否则前面的失败会被截掉）
            $lines = Get-Content $log
            $idx = 0
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '✗|失败项：') { $idx = $i; break }
            }
            $from = [Math]::Max(0, $idx - 3)
            $seg = $lines[$from..([Math]::Min($lines.Count - 1, $from + 60))] -join "`n"
            $enc = ($seg -replace "%", "%25") -replace "`r?`n", "%0A"
            Write-Host "::error title=自测失败::${enc}"
            Write-Host "::group::失败详情"
            Write-Host $seg
            Write-Host "::endgroup::"
          }
          exit $code

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-blocks-log
          path: ${{ runner.temp }}/all-blocks.log
          if-no-files-found: ignore

      - name: Guard — no hardcoded developer-machine absolute paths
        shell: pwsh
        run: |
          # 判据：只查**会执行的、指向开发机自己的**绝对路径字面量。
          #   · 注释里提一嘴 F:\workspace 是历史说明，不会被执行 → 放行
          #   · 测试夹具里的假路径（'C:\w'、'F:\x.txt'）是测试数据 → 放行
          #   · 引号里包着的 F:\workspace... / C:\Users\Diccup... → 别人机器上没有 → 违规
          $pattern = "['`"][A-Za-z]:\\\\+[^'`"]+['`"]"
          # 开发机专属路径：LongMem 工作区 + 实现方的用户名
          $devbox = 'F:\\\\workspace\\\\LongMem|C:\\\\Users\\\\Diccup'
          $hits = Get-ChildItem -Recurse -Include *.js,*.mjs,*.py,*.ps1,*.json,*.yml -File |
            Where-Object { $_.FullName -notmatch '\\.git\\' -and $_.FullName -notmatch '\\deps\\pylibs\\' } |
            Select-String -Pattern $pattern -AllMatches |
            Where-Object { $_.Line -match $devbox -and $_.Line -notmatch '^\s*(//|#|\*|<!--)' }
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Host 'FAIL: hardcoded developer-machine path found'
            exit 1
          }
          Write-Host 'OK: no developer-machine absolute path'
